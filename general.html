<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長野県 一般分布 マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  .box { position: absolute; z-index: 1; background: #fffe; padding: 8px 12px; border-radius: 6px; font: 13px/1.5 sans-serif; }
  #panel { top: 10px; left: 10px; max-width: 260px; }
  #legend { bottom: 28px; left: 10px; }
  #legend i { display: inline-block; width: 18px; height: 12px; margin-right: 6px; vertical-align: middle; }
  select { font-size: 13px; }
  small { color: #555; }
  a { color: #1a5fb4; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel" class="box">
  <b>長野県 一般分布マップ</b><br>
  <small>GBIFの全出現記録の密度（六角形ビン）。ズームすると細かくなります。色が濃いほど記録が多い。</small><br>
  分類群：
  <select id="taxon">
    <option value="">すべての生物</option>
    <option value="6">植物</option>
    <option value="1">動物（全体）</option>
    <option value="212">鳥類</option>
    <option value="359">哺乳類</option>
    <option value="358">爬虫類</option>
    <option value="131">両生類</option>
    <option value="204">魚類</option>
    <option value="216">昆虫類</option>
    <option value="5">菌類</option>
  </select><br>
  <small>記録の多さは調査の多さを反映します（生き物が多い場所とは限りません）。</small>
  <div style="margin-top:6px"><a href="rare.html">→ 絶滅危惧種マップへ</a> ／ <a href="./">トップ</a></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { gsi: { type: 'raster', tileSize: 256,
      tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a> | データ: <a href="https://www.gbif.org">GBIF</a>' } },
    layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }]
  },
  center: [138.0, 36.15], zoom: 7.3
});
map.addControl(new maplibregl.NavigationControl());
const addMask = () => {
  map.addSource('mask', { type: 'geojson', data: 'data/nagano_mask.geojson' });
  map.addLayer({ id: 'mask', type: 'fill', source: 'mask', paint: { 'fill-color': '#ffffff', 'fill-opacity': 0.82 } });
};
const tiles = () => 'https://api.gbif.org/v2/map/occurrence/density/{z}/{x}/{y}@2x.png?srs=EPSG:3857&bin=hex&hexPerTile=50&style=green2.poly&country=JP'
  + (document.getElementById('taxon').value ? '&taxonKey=' + document.getElementById('taxon').value : '');
const addGen = () => {
  if (map.getLayer('gen')) map.removeLayer('gen');
  if (map.getSource('gen')) map.removeSource('gen');
  map.addSource('gen', { type: 'raster', tileSize: 512, tiles: [tiles()], bounds: [137.3, 35.2, 138.8, 37.1] });
  map.addLayer({ id: 'gen', type: 'raster', source: 'gen', paint: { 'raster-opacity': 0.75 } }, 'mask');
};
map.on('load', () => {
  addMask();
  addGen();
  document.getElementById('taxon').onchange = addGen;
});
</script>
</body>
</html>
