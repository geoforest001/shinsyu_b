<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地形解析マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel { position: absolute; top: 10px; left: 10px; z-index: 1; background: #fffe;
           padding: 8px 12px; border-radius: 6px; font: 14px sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"><b>地形解析マップ</b></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      gsi: { type: 'raster', tileSize: 256,
             tiles: ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'],
             attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>' }
    },
    layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }]
  },
  center: [137.95, 36.0], zoom: 9
});
map.addControl(new maplibregl.NavigationControl());
// TODO: 傾斜・陰影・曲率などの解析レイヤ(タイル)を data/ から追加
</script>
</body>
</html>
