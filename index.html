<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長野県 絶滅危惧種 分布マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  .box { position: absolute; z-index: 1; background: #fffe; padding: 8px 12px; border-radius: 6px; font: 13px/1.5 sans-serif; }
  #panel { top: 10px; left: 10px; max-width: 260px; }
  #legend { bottom: 28px; left: 10px; }
  #legend i { display: inline-block; width: 18px; height: 12px; margin-right: 6px; vertical-align: middle; }
  select { font-size: 13px; }
  small { color: #555; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel" class="box">
  <b>長野県 絶滅危惧種 分布マップ</b><br>
  <small>IUCNレッドリスト CR/EN/VU の出現記録を約5kmメッシュに集計</small><br>
  表示：
  <select id="mode">
    <option value="n">記録数</option>
    <option value="sp">種数</option>
  </select>
</div>
<div id="legend" class="box"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const COLORS = ['#ffffb2', '#fecc5c', '#fd8d3c', '#e31a1c', '#800026'];
const STEPS = { n: [1, 5, 20, 60], sp: [1, 3, 6, 12] };
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { gsi: { type: 'raster', tileSize: 256,
      tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a> | データ: <a href="https://www.gbif.org">GBIF</a>' } },
    layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }]
  },
  center: [138.0, 36.15], zoom: 7.3
});
map.addControl(new maplibregl.NavigationControl());

function colorExpr(f) {
  const s = STEPS[f];
  const e = ['step', ['get', f], COLORS[0]];
  for (let i = 1; i < s.length; i++) e.push(s[i], COLORS[i]);
  return e;
}
function legend(f) {
  const s = STEPS[f], lab = [];
  for (let i = 0; i < s.length; i++)
    lab.push(`<div><i style="background:${COLORS[i]}"></i>${s[i]}${i + 1 < s.length ? '–' + (s[i + 1] - 1) : '以上'}</div>`);
  lab.push(`<div><i style="background:${COLORS[4]}"></i>${s[s.length - 1]}以上</div>`);
  lab.pop(); lab[lab.length - 1] = `<div><i style="background:${COLORS[3]}"></i>${s[3]}以上</div>`;
  document.getElementById('legend').innerHTML = '<b>' + (f === 'n' ? '記録数' : '種数') + '</b>' + lab.join('');
}
map.on('load', () => {
  map.addSource('mesh', { type: 'geojson', data: 'data/mesh_nagano.geojson' });
  map.addLayer({ id: 'mesh', type: 'fill', source: 'mesh',
    paint: { 'fill-color': colorExpr('n'), 'fill-opacity': 0.7, 'fill-outline-color': '#fff8' } });
  legend('n');
  document.getElementById('mode').onchange = e => {
    map.setPaintProperty('mesh', 'fill-color', colorExpr(e.target.value));
    legend(e.target.value);
  };
  map.on('click', 'mesh', e => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
      `<b>記録数 ${p.n} / 種数 ${p.sp}</b><br>CR ${p.CR} ・ EN ${p.EN} ・ VU ${p.VU}<br>` +
      `動物 ${p['動物']} ・ 植物 ${p['植物']} ・ 菌類 ${p['菌類']}`).addTo(map);
  });
  map.on('mouseenter', 'mesh', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'mesh', () => map.getCanvas().style.cursor = '');
});
</script>
</body>
</html>
